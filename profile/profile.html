<!DOCTYPE html>
<html lang="th" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ | HomPB</title>
    <link rel="icon" href="../img/Logo/hompb-icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Archivo:wdth,wght@62..125,100..900&display=swap">
    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <!-- แถบบนสุด: โลโก้ + กลับหน้าร้าน + เปลี่ยนธีม + ออกจากระบบ -->
    <header class="topbar">
        <div class="topbar-in">
            <a href="../index.html" class="logo" aria-label="HomPB หน้าแรก"><img class="logo-ic" src="../img/Logo/hompb-icon.svg" alt="" width="36" height="36">HOMPB</a>
            <div class="header-actions">
                <a href="../index.html" class="back-link">&#8592; กลับไปหน้าร้าน</a>
                <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()"
                    aria-label="เปลี่ยนธีม">
                    <span id="themeIcon">☀️</span> <span id="themeText">โหมดสว่าง</span>
                </button>
                <!-- signOut() อยู่ใน js/supabase.js: ออกจากระบบแล้วไปหน้า login -->
                <button type="button" class="theme-toggle-btn logout-btn" onclick="signOut()">ออกจากระบบ</button>
            </div>
        </div>
    </header>
    <!--theme-toggle-btn is a class for styling(ตกแต่ง) the button,
    onclick="toggleTheme()" calls the theme change function (ฟังก์ชันเปลี่ยนธีม) when clicked,
    themeIcon is used to display a sun or moon icon (ใช้แสดงไอคอนพระอาทิตย์หรือพระจันทร์).
    themeText is used to display Light or Dark text (ใช้แสดงข้อความ Light หรือ Dark).-->

    <main class="profile-container">

        <div class="page-head">
            <p class="eyebrow">บัญชีของฉัน</p>
            <h1>โปรไฟล์</h1>
        </div>

        <div class="profile-layout">

            <!-- ===== ซ้าย: รูป ชื่อ ปุ่มแก้ไข ทางลัด ===== -->
            <aside class="profile-card side-card">
                <div class="cover"></div>

                <!-- Profile Image -->
                <div class="profile-image" id="profileImageWrapper">
                    <img src="../img/icons/avatar-default.svg" alt="รูปโปรไฟล์" id="profileImg">
                    <div class="image-overlay" onclick="document.getElementById('avatarInput').click()">
                        <span>&#9998; เปลี่ยนรูป</span>
                    </div>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none"
                        onchange="changeAvatar(event)">
                </div>

                <!-- ../img/icons/avatar-default.svg is the default avatar (same picture every time) until the user uploads one,
                 image-overlay is a part that displays a pencil icon when hovering or clicking on the image,
                 type="file" is a type for upload picture , image/* is surname file EX. .PNG , .PDF -->

                <!-- Display Name & Username -->
                <div class="name-block">
                    <h2 id="displayFullName">&nbsp;</h2>
                    <p class="username" id="displayUsername">&nbsp;</p>
                </div>

                <!-- Edit Profile Button -->
                <button type="button" class="edit-btn" id="editBtn" onclick="toggleEdit()">&#9998; แก้ไขโปรไฟล์</button>

                <!-- ทางลัดไปหน้าอื่นของลูกค้า -->
                <nav class="quick-links" aria-label="ทางลัด">
                    <a href="../orders.html">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>
                        <span>คำสั่งซื้อของฉัน</span><i>&#8250;</i>
                    </a>
                    <a href="../favorites.html">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
                        <span>รายการโปรด</span><i>&#8250;</i>
                    </a>
                    <a href="../cart.html">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
                        <span>ตะกร้าสินค้า</span><i>&#8250;</i>
                    </a>
                </nav>
            </aside>

            <!-- ===== ขวา: ข้อมูลส่วนตัว (ดู / แก้ไข) ===== -->
            <section class="profile-card main-card">

                <!-- ===== VIEW MODE ===== -->
                <div class="profile-info" id="viewMode">
                    <h3 class="card-title">ข้อมูลส่วนตัว</h3>
                    <div class="info-grid">
                        <div class="info-group">
                            <span class="info-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
                            <div>
                                <label>ชื่อ-นามสกุล</label>
                                <p id="viewFullName"></p>
                            </div>
                        </div>
                        <div class="info-group">
                            <span class="info-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></svg></span>
                            <div>
                                <label>เบอร์โทรศัพท์</label>
                                <p id="viewPhone"></p>
                            </div>
                        </div>
                        <div class="info-group wide">
                            <span class="info-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
                            <div>
                                <label>อีเมล</label>
                                <p id="viewEmail"></p>
                            </div>
                        </div>
                    </div>

                    <h3 class="card-title">ที่อยู่จัดส่ง</h3>
                    <div id="viewAddresses"></div>
                </div>

                <!-- ===== EDIT MODE ===== -->
                <div class="edit-form" id="editMode" style="display:none;">
                    <h3 class="card-title">แก้ไขข้อมูลส่วนตัว</h3>

                    <div class="form-group">
                        <label for="editFullName">ชื่อ-นามสกุล</label>
                        <input type="text" id="editFullName" placeholder="ชื่อ นามสกุล">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editEmail">อีเมล</label>
                            <input type="email" id="editEmail" placeholder="email@example.com" disabled
                                title="อีเมลใช้เข้าสู่ระบบ เปลี่ยนในหน้านี้ไม่ได้">
                            <small class="hint">อีเมลใช้เข้าสู่ระบบ เปลี่ยนไม่ได้</small>
                        </div>

                        <div class="form-group">
                            <label for="editPhone">เบอร์โทรศัพท์</label>
                            <input type="tel" id="editPhone" placeholder="0xx-xxx-xxxx">
                        </div>
                    </div>

                    <!-- Multiple Addresses -->
                    <div class="form-group">
                        <label>ที่อยู่จัดส่ง</label>
                        <div id="addressList"></div>
                        <button type="button" class="add-address-btn" onclick="addAddressField()">
                            &#43; เพิ่มที่อยู่
                        </button>
                    </div>

                    <!-- Save / Cancel Buttons -->
                    <div class="form-actions">
                        <button type="button" class="cancel-btn" onclick="cancelEdit()">ยกเลิก</button>
                        <button type="button" class="save-btn" onclick="saveProfile()">&#10003; บันทึก</button>
                    </div>
                    <!-- onclick if click button excute command -->

                </div>

            </section>
        </div>
    </main>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script>
        // ===================== DATA =====================
        let profile = {
            name: 'johndoe',
            fullName: 'John Doe',
            email: 'johndoe@gmail.com',
            phone: '012-345-6789',
            addresses: [
                { id: 1, text: '3 Main St, Anytown, USA', isDefault: true }
            ],
            avatar: '../img/icons/avatar-default.svg' // รูปเริ่มต้น (เดิมใช้ pravatar.cc ซึ่งสุ่มรูปใหม่ทุกครั้งที่เปิด)
        };

        // Temporary working copy during edit mode (prevents corruption on Cancel)
        let tempAddresses = [];
        let isEditing = false;
        let toastTimer = null;
        // tempAdress is Store temporary address data(ข้อมูลชั่วคราว) while editing.
        //  isEditing Use this to check if you are in edit mode. (true = editing, false = view).
        // toastTimer Used to store a timer for hiding notification messages.



        // ===================== INIT =====================
        let me = null; // profile จาก Supabase (requireLogin ใน js/supabase.js)

        window.onload = async function () {
            initTheme();
            me = await requireLogin(); // ยังไม่ล็อกอิน → ไปหน้า login แล้วกลับมาหน้านี้
            await loadProfileData();
            renderView();
        };

        // ข้อมูลจริงจากตาราง profiles + addresses (รูปโปรไฟล์ยังเก็บในเบราว์เซอร์ เพราะฐานข้อมูลไม่มีช่องรูป)
        async function loadProfileData() {
            const { data: addrs, error } = await sb
                .from('addresses')
                .select('id, address_line, subdistrict, district, province, postcode, is_default')
                .eq('user_id', me.id)
                .order('created_at');
            if (error) showToast('โหลดที่อยู่ไม่สำเร็จ: ' + errText(error), 'error');
            profile.name = me.email.split('@')[0];
            profile.fullName = me.full_name || '';
            profile.email = me.email;
            profile.phone = me.phone || '';
            profile.addresses = (addrs || []).map(x => ({
                id: x.id,
                text: [x.address_line, x.subdistrict, x.district, x.province, x.postcode].filter(Boolean).join(' '),
                isDefault: x.is_default,
            }));
            try {
                profile.avatar = localStorage.getItem('avatar:' + me.id) || profile.avatar;
            } catch (e) {}
        }
        // initTheme() loads and sets the theme for the webpage.
        // renderView() displays the profile information on the webpage.

        // ===================== THEME =====================
        function initTheme() {
            try {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                applyTheme(savedTheme);
            } catch (e) {
                applyTheme('dark');
            }
        }
        // If a saved theme exists(หากมีธีมที่บันทึกไว้แล้ว), it will be applied(จะทำการโหลดขึ้นมาใช้).
        // If not, Dark Mode will be used by default.
        // In the event of an error, it will default to Dark Mode(ถ้าเกิดข้อผิดพลาดจะกำหนดให้เป็น Darkmode).

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
            try {
                localStorage.setItem('theme', nextTheme);
            } catch (e) { }
        }
        // Switches between Dark Mode and Light Mode when the user presses the button.

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                if (icon) icon.textContent = '☀️';
                if (text) text.textContent = 'โหมดสว่าง';
            } else {
                if (icon) icon.textContent = '🌙';
                if (text) text.textContent = 'โหมดมืด';
            }
        }
        // If you change the CSS theme, the colors will be adjusted to suit the theme you have selected.

        // ===================== AVATAR =====================
        function changeAvatar(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                profile.avatar = e.target.result;
                document.getElementById('profileImg').src = e.target.result;
                try {
                    localStorage.setItem('avatar:' + me.id, e.target.result);
                } catch (err) {}
                showToast('เปลี่ยนรูปโปรไฟล์แล้ว ✓');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // edit avatar profile

        // ===================== TOGGLE EDIT =====================
        function toggleEdit() {
            if (!isEditing) {
                openEdit();
            } else {
                cancelEdit();
            }
        }

        function openEdit() {
            isEditing = true;
            // Clone addresses for safe editing
            tempAddresses = JSON.parse(JSON.stringify(profile.addresses));

            document.getElementById('editFullName').value = profile.fullName;
            document.getElementById('editEmail').value = profile.email;
            document.getElementById('editPhone').value = profile.phone;
            renderAddressFields();

            document.getElementById('viewMode').style.display = 'none';
            document.getElementById('editMode').style.display = 'block';
            const btn = document.getElementById('editBtn');
            btn.innerHTML = '&#10005; ยกเลิกการแก้ไข';
            btn.classList.add('active');
        }

        function cancelEdit() {
            isEditing = false;
            tempAddresses = [];
            document.getElementById('editMode').style.display = 'none';
            document.getElementById('viewMode').style.display = 'block';
            const btn = document.getElementById('editBtn');
            btn.innerHTML = '&#9998; แก้ไขโปรไฟล์';
            btn.classList.remove('active');
        }

        // ===================== VIEW RENDER =====================
        function renderView() {
            document.getElementById('displayFullName').textContent = profile.fullName || 'ยังไม่ได้ตั้งชื่อ';
            document.getElementById('displayUsername').textContent = '@' + profile.name;
            document.getElementById('viewFullName').textContent = profile.fullName || '-';
            document.getElementById('viewEmail').textContent = profile.email;
            document.getElementById('viewPhone').textContent = profile.phone || '-';
            document.getElementById('profileImg').src = profile.avatar;

            // Render address list in view mode
            const viewAddr = document.getElementById('viewAddresses');
            viewAddr.innerHTML = profile.addresses.length ? '' : '<p class="empty-addr">ยังไม่มีที่อยู่ กด "แก้ไขโปรไฟล์" เพื่อเพิ่ม</p>';
            profile.addresses.forEach(addr => {
                const div = document.createElement('div');
                div.className = 'address-view-item';
                div.innerHTML = `
                    <svg class="addr-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
                    <span class="addr-text">${escapeHtml(addr.text)}</span>
                    ${addr.isDefault ? '<span class="badge-default">ที่อยู่หลัก</span>' : ''}
                `;
                viewAddr.appendChild(div);
            });
        }

        // ===================== ADDRESS FIELDS (EDIT MODE) =====================
        function renderAddressFields() {
            const list = document.getElementById('addressList');
            list.innerHTML = '';
            tempAddresses.forEach((addr, idx) => {
                list.appendChild(createAddressRow(addr.text, idx, addr.isDefault));
            });
        }

        function createAddressRow(text, idx, isDefault) {
            const row = document.createElement('div');
            row.className = 'address-row';
            row.dataset.idx = idx;
            row.innerHTML = `
                <div class="addr-input-wrap">
                    <input type="text" class="addr-input" value="${escapeHtml(text)}" placeholder="บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์" oninput="updateAddressText(${idx}, this.value)">
                    <label class="default-label">
                        <input type="radio" name="defaultAddr" ${isDefault ? 'checked' : ''} onchange="setDefault(${idx})">
                        <span>ที่อยู่หลัก</span>
                    </label>
                </div>
                <button type="button" class="remove-addr-btn" onclick="removeAddress(${idx})" title="ลบที่อยู่" aria-label="ลบที่อยู่">&#128465;</button>
            `;
            return row;
        }

        function updateAddressText(idx, val) {
            if (tempAddresses[idx]) {
                tempAddresses[idx].text = val;
            }
        }

        function addAddressField() {
            syncAddressInputs();
            const hasDefault = tempAddresses.some(a => a.isDefault);
            tempAddresses.push({
                id: Date.now(),
                text: '',
                isDefault: !hasDefault
            });
            renderAddressFields();
            const inputs = document.querySelectorAll('.addr-input');
            if (inputs.length) inputs[inputs.length - 1].focus();
        }

        function removeAddress(idx) {
            syncAddressInputs();
            const wasDefault = tempAddresses[idx].isDefault;
            tempAddresses.splice(idx, 1);
            if (wasDefault && tempAddresses.length > 0) {
                tempAddresses[0].isDefault = true;
            }
            renderAddressFields();
        }

        function setDefault(idx) {
            syncAddressInputs();
            tempAddresses.forEach((a, i) => a.isDefault = (i === idx));
        }

        function syncAddressInputs() {
            const inputs = document.querySelectorAll('.addr-input');
            inputs.forEach((input, i) => {
                if (tempAddresses[i]) {
                    tempAddresses[i].text = input.value.trim();
                }
            });
        }

        // ===================== SAVE =====================
        // ชื่อ + เบอร์ → profiles / ที่อยู่ → addresses (ทั้งบรรทัดเก็บใน address_line ช่องอื่นเว้นว่าง
        // จนกว่าจะมีฟอร์มแยก ตำบล/อำเภอ/จังหวัด/รหัสไปรษณีย์) ตอนสั่งซื้อระบบคัดลอกที่อยู่นี้ไปเก็บในคำสั่งซื้อ
        async function saveProfile() {
            const fullName = document.getElementById('editFullName').value.trim();
            const phone = document.getElementById('editPhone').value.trim();

            if (!fullName) { showToast('กรุณากรอกชื่อ-นามสกุล', 'error'); return; }
            if (!phone) { showToast('กรุณากรอกเบอร์โทรศัพท์', 'error'); return; }

            syncAddressInputs();
            if (tempAddresses.some(a => !a.text || a.text.trim() === '')) {
                showToast('กรุณากรอกที่อยู่ให้ครบทุกช่อง', 'error');
                return;
            }
            if (tempAddresses.length && !tempAddresses.some(a => a.isDefault)) {
                tempAddresses[0].isDefault = true;
            }

            const saveBtn = document.querySelector('.save-btn');
            saveBtn.disabled = true;
            const err = await saveToDb(fullName, phone);
            saveBtn.disabled = false;
            if (err) { showToast('บันทึกไม่สำเร็จ: ' + err, 'error'); return; }

            me.full_name = fullName;
            me.phone = phone;
            await loadProfileData(); // โหลด id ของที่อยู่ใหม่จากฐานข้อมูล
            renderView();
            cancelEdit();
            showToast('บันทึกโปรไฟล์แล้ว ✓');
        }

        // คืนข้อความ error หรือ '' ถ้าบันทึกครบ
        async function saveToDb(fullName, phone) {
            const { error: e1 } = await sb.from('profiles').update({ full_name: fullName, phone }).eq('id', me.id);
            if (e1) return errText(e1);

            // ที่อยู่หลักมีได้ทีละ 1 ที่ (unique index) ปลดของเดิมก่อน แล้วค่อยตั้งใหม่ทีหลังสุด
            const { error: e2 } = await sb.from('addresses').update({ is_default: false }).eq('user_id', me.id);
            if (e2) return errText(e2);

            const isDb = (a) => typeof a.id === 'string'; // id จากฐานข้อมูลเป็น uuid, ที่เพิ่มใหม่เป็นตัวเลข
            const keep = tempAddresses.filter(isDb).map(a => a.id);
            const removed = profile.addresses.filter(a => !keep.includes(a.id)).map(a => a.id);
            if (removed.length) {
                const { error } = await sb.from('addresses').delete().in('id', removed);
                if (error) return errText(error);
            }
            const row = (a) => ({
                user_id: me.id, recipient_name: fullName, phone, address_line: a.text.trim(),
                subdistrict: '', district: '', province: '', postcode: '', is_default: a.isDefault,
            });
            const ordered = [...tempAddresses.filter(a => !a.isDefault), ...tempAddresses.filter(a => a.isDefault)];
            for (const a of ordered) {
                const { error } = isDb(a)
                    ? await sb.from('addresses').update(row(a)).eq('id', a.id)
                    : await sb.from('addresses').insert(row(a));
                if (error) return errText(error);
            }
            return '';
        }

        // ===================== TOAST =====================
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.className = 'toast show ' + (type === 'error' ? 'toast-error' : 'toast-success');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // ===================== HELPER =====================
        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>

</body>

</html>
