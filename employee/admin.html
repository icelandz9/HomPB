<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOMPB ระบบหลังบ้าน (Admin)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../img/Logo/hompb-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="admin.css" />
  </head>

  <body>
    <!-- ========== โครงหน้า: Sidebar + เนื้อหา ========== -->
    <div id="app">
      <aside>
        <h1 class="logo"><img class="logo-ic" src="../img/Logo/hompb-icon.svg" alt="" width="36" height="36">HOMPB</h1>
        <p class="sub">ระบบหลังบ้าน</p>
        <nav id="nav"></nav>
        <button class="out" onclick="logout()"><img src="/img/icons/dark/logout-box-r-line.png" alt="">ออกจากระบบ</button>
      </aside>
      <main>
        <div class="top">
          <div><b id="tn"></b><small id="te"></small></div>
          <a
            class="btn line"
            href="../index.html"
            target="_blank"
            rel="noopener"
            >ดูหน้าร้าน</a
          >
        </div>
        <div class="pg" id="pg"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
