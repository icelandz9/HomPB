<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOMPB ระบบหลังบ้าน (Admin)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../img/logo/hompb-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="admin.css" />
  </head>

  <body>
    <!-- ========== โครงหน้า: Sidebar + เนื้อหา ========== -->
    <div id="app">
      <aside>
        <h1 class="logo"><img class="logo-ic" src="../img/logo/hompb-icon.svg" alt="" width="36" height="36">HOMPB</h1>
        <p class="sub">ระบบหลังบ้าน</p>
        <nav id="nav"></nav>
        <button class="out" onclick="logout()"><img src="/img/icons/logout.png" alt="">ออกจากระบบ</button>
      </aside>
      <main>
        <div class="top">
          <div><b id="tn"></b><small id="te"></small></div>
          <a
            class="btn line"
            href="../index.html"
            target="_blank"
            rel="noopener"
            >ดูหน้าร้าน<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a
          >
        </div>
        <div class="pg" id="pg"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <!-- ตรวจรูป QR พร้อมเพย์ก่อนบันทึกตั้งค่าร้าน -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="../js/promptpay.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
