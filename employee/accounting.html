<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOMPB ระบบหลังบ้าน (ฝ่ายบัญชี)</title>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #130f0e;
            --panel: #211a18;
            --side: #2b211e;
            --line: #3a2f2b;
            --acc: #a52c1c;
            --text: #f6efeb;
            --mute: #b9aaa3;
            --ok: #9fd8a8;
            --okbg: #1f3a2a;
            --warn: #f1cd6b;
            --warnbg: #3b2f14;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Anuphan', 'Noto Sans Thai', system-ui, sans-serif;
            font-size: 16px
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit
        }

        label {
            display: block;
            font-weight: 700;
            margin: 0 0 6px
        }

        input,
        select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px 14px
        }

        input:focus,
        select:focus,
        button:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        .btn {
            background: var(--acc);
            border: 0;
            border-radius: 999px;
            padding: 10px 22px;
            font-weight: 700;
            cursor: pointer
        }

        .btn.line {
            background: none;
            border: 1px solid var(--line)
        }

        .btn.sm {
            padding: 6px 14px
        }

        .logo {
            font-size: 34px;
            font-weight: 700;
            margin: 0
        }

        .sub {
            color: var(--mute);
            margin: 2px 0 0
        }

        /* โครงหน้า */
        #app {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh
        }

        aside {
            background: var(--side);
            padding: 28px 14px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh
        }

        aside .logo,
        aside .sub {
            padding: 0 10px
        }

        aside .sub {
            margin-bottom: 34px
        }

        nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        nav button,
        .out {
            background: none;
            border: 0;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            cursor: pointer;
            color: var(--text);
            display: flex;
            gap: 12px;
            align-items: center
        }

        nav button:hover,
        .out:hover {
            background: #3a2d29
        }

        nav button.on {
            background: var(--acc)
        }

        main {
            min-width: 0
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            background: #1c1513;
            border-bottom: 1px solid var(--line)
        }

        .top small {
            color: var(--mute);
            display: block
        }

        .pg {
            padding: 34px 30px 60px
        }

        h1 {
            font-size: 40px;
            margin: 0
        }

        .who {
            color: var(--mute);
            font-size: 19px;
            margin: 6px 0 26px
        }

        /* การ์ด / ตาราง */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 26px;
            margin-bottom: 26px;
            overflow: hidden
        }

        .ch {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px 28px;
            border-bottom: 1px solid var(--line)
        }

        .ch h2 {
            margin: 0;
            font-size: 22px
        }

        .ch span {
            color: var(--mute)
        }

        .cb {
            padding: 22px 28px
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 820px
        }

        th {
            text-align: left;
            color: var(--mute);
            padding: 14px 16px;
            background: #1c1513;
            white-space: nowrap
        }

        td {
            padding: 12px 16px;
            border-top: 1px solid var(--line);
            vertical-align: middle
        }

        td.empty {
            text-align: center;
            color: var(--mute);
            padding: 36px
        }

        .pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px
        }

        .pill.o {
            background: var(--okbg);
            color: var(--ok)
        }

        .pill.w {
            background: var(--warnbg);
            color: var(--warn)
        }

        .pill.r {
            background: #3d1914;
            color: #ff9d8f
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 26px
        }

        .kpi {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px
        }

        .kpi p {
            margin: 0;
            color: var(--mute)
        }

        .kpi b {
            display: block;
            font-size: 44px;
            margin-top: 10px
        }

        .form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            align-items: end
        }

        .filters {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            padding: 18px 28px;
            border-bottom: 1px solid var(--line)
        }

        .filters>div {
            flex: 1;
            min-width: 200px
        }

        .acts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .muted {
            color: var(--mute)
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--acc);
            padding: 12px 20px;
            border-radius: 14px
        }

        @media(max-width:860px) {
            #app {
                grid-template-columns: 1fr
            }

            aside {
                position: static;
                height: auto;
                padding: 16px
            }

            nav {
                flex-direction: row;
                overflow-x: auto
            }

            nav button {
                white-space: nowrap
            }

            h1 {
                font-size: 30px
            }

            .pg,
            .top {
                padding-left: 16px;
                padding-right: 16px
            }
        }
    </style>
</head>

<body>

    <!-- ========== โครงหน้า: Sidebar + เนื้อหา ========== -->
    <div id="app">
        <aside>
            <h1 class="logo">HOMPB</h1>
            <p class="sub">ระบบหลังบ้าน</p>
            <nav id="nav"></nav>
            <button class="out" onclick="logout()">⎋ ออกจากระบบ</button>
        </aside>
        <main>
            <div class="top">
                <div><b id="tn"></b><small id="te"></small></div>
                <button class="btn line" onclick="toast('ใส่ลิงก์หน้าร้านภายหลัง')">ดูหน้าร้าน</button>
            </div>
            <div class="pg" id="pg"></div>
        </main>
    </div>

    <script>
        // ========== ผู้ใช้ปัจจุบัน (เชื่อมกับ Login ภายหลัง) ==========
        const me = { name: 'ฝ่ายบัญชี', email: 'finance@hompb.com', role: 'ฝ่ายบัญชี' };

        // ========== สิทธิ์ของฝ่ายบัญชี: M = จัดการ, V = ดูอย่างเดียว ==========
        const ACL = { overview: 'V', orders: 'V', finance: 'M' };
        const PAGES = [['overview', 'ภาพรวม', '▦'], ['orders', 'คำสั่งซื้อ', '☰'], ['finance', 'การเงิน & ชำระเงิน', '▭']];

        // ========== ข้อมูล (ว่างไว้ก่อน ค่อยเชื่อม API/ฐานข้อมูลภายหลัง) ==========
        // payments: {orderId,date,amt,slip,slipUrl,status:'wait'|'ok'|'bad'|'refund',refundAmt,note}
        let payments = [];
        // orders: {id,cust,items,amt,status,date}  (ฝ่ายบัญชีเห็นยอดเงิน แต่ไม่เห็นที่อยู่)
        let orders = [];
        // history: [เวลา, คำสั่งซื้อ, การดำเนินการ, จำนวนเงิน, หมายเหตุ, ผู้ทำ]
        let history = [];
        let refundIdx = null;   // แถวที่กำลังทำรายการคืนเงิน
        let rejectIdx = null;   // แถวที่กำลังบันทึกเหตุผลไม่ผ่าน

        // ========== ฟังก์ชันช่วย ==========
        const $ = s => document.querySelector(s);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const baht = n => '฿' + Number(n).toLocaleString('th-TH');
        const canM = p => ACL[p] === 'M';
        function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2200) }
        function logout() { toast('เชื่อมปุ่มออกจากระบบกับหน้า Login ภายหลัง') }
        function guard(p) { if (!canM(p)) { toast('คุณไม่มีสิทธิ์ดำเนินการนี้'); return false } return true }
        function card(title, note, body, pad) { return `<div class="card"><div class="ch"><h2>${title}</h2><span>${note || ''}</span></div>${pad ? `<div class="cb">${body}</div>` : body}</div>` }
        function table(heads, rowsHtml, id) { return `<div class="tw"><table><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr><tbody${id ? ` id="${id}"` : ''}>${rowsHtml || `<tr><td class="empty" colspan="${heads.length}">ยังไม่มีข้อมูล</td></tr>`}</tbody></table></div>` }
        function payPill(s) { return { wait: '<span class="pill w">รอตรวจสอบ</span>', ok: '<span class="pill o">ยืนยันแล้ว</span>', bad: '<span class="pill r">ไม่ผ่าน</span>', refund: '<span class="pill r">คืนเงินแล้ว</span>' }[s] || esc(s) }
        function addHistory(orderId, action, amt, note) { history.unshift([new Date().toLocaleString('th-TH'), orderId, action, amt, note || '-', me.email]) }

        // ========== เปลี่ยนหน้า (เมนูแสดงตามสิทธิ์) ==========
        function go(p) {
            if (!ACL[p]) p = 'overview';
            $('#nav').innerHTML = PAGES.filter(x => ACL[x[0]]).map(x => `<button class="${x[0] === p ? 'on' : ''}" onclick="go('${x[0]}')"><span aria-hidden="true">${x[2]}</span>${x[1]}</button>`).join('');
            const t = PAGES.find(x => x[0] === p)[1];
            $('#pg').innerHTML = `<h1>${t}</h1><p class="who">${me.role} · สิทธิ์: ${canM(p) ? 'จัดการ' : 'ดูอย่างเดียว'}</p>` + VIEWS[p]();
            window.scrollTo(0, 0);
        }

        // ========== เนื้อหาแต่ละหน้า ==========
        const VIEWS = {

            // ---- ภาพรวม (ดูอย่างเดียว) ----
            overview() {
                const k = (l, v) => `<div class="kpi"><p>${l}</p><b>${v}</b></div>`;
                const sum = f => payments.filter(f).reduce((a, p) => a + Number(p.amt), 0);
                const refunded = payments.filter(p => p.status === 'refund').reduce((a, p) => a + Number(p.refundAmt || 0), 0);
                return `<div class="kpis">
  ${k('สลิปรอตรวจสอบ', payments.filter(p => p.status === 'wait').length)}
  ${k('ยอดที่ยืนยันแล้ว', baht(sum(p => p.status === 'ok')))}
  ${k('ยอดรอตรวจสอบ', baht(sum(p => p.status === 'wait')))}
  ${k('ยอดที่คืนเงินแล้ว', baht(refunded))}
 </div>`;
            },

            // ---- คำสั่งซื้อ (ดูอย่างเดียว เห็นยอดเงิน ไม่เห็นที่อยู่) ----
            orders() {
                const rows = orders.map(o => `<tr><td><b>${o.id}</b></td><td>${esc(o.cust)}</td><td>${esc(o.items)}</td><td>${baht(o.amt)}</td><td>${esc(o.status)}</td><td>${o.date}</td></tr>`).join('');
                return card('คำสั่งซื้อ', 'ดูอย่างเดียว · ที่อยู่ลูกค้าเห็นได้เฉพาะฝ่ายจัดส่ง', table(['คำสั่งซื้อ', 'ลูกค้า', 'สินค้า', 'ยอดเงิน', 'สถานะ', 'วันที่'], rows));
            },

            // ---- การเงิน & ชำระเงิน (จัดการได้) ----
            finance() {
                return (rejectIdx !== null ? rejectForm() : '')
                    + (refundIdx !== null ? refundForm() : '')
                    + card('ตรวจสอบการชำระเงิน', 'ข้อมูลการเงินเป็นความลับ · เข้าถึงได้เฉพาะ Admin และฝ่ายบัญชี',
                        `<div class="filters">
     <div><label for="fq">ค้นหาคำสั่งซื้อ</label><input id="fq" placeholder="เช่น HPB1001" oninput="renderRows()"></div>
     <div><label for="fs">สถานะ</label><select id="fs" onchange="renderRows()">
       <option value="">ทั้งหมด</option><option value="wait">รอตรวจสอบ</option><option value="ok">ยืนยันแล้ว</option><option value="bad">ไม่ผ่าน</option><option value="refund">คืนเงินแล้ว</option></select></div>
    </div>`
                        + table(['คำสั่งซื้อ', 'ยอดเงิน', 'หลักฐานการโอน', 'สถานะ', 'หมายเหตุ', 'การดำเนินการ'], rowsHtml(), 'prow'))
                    + card('ประวัติการดำเนินการ', 'บันทึกทุกครั้งที่อนุมัติ ปฏิเสธ หรือคืนเงิน',
                        table(['เวลา', 'คำสั่งซื้อ', 'การดำเนินการ', 'จำนวนเงิน', 'หมายเหตุ', 'ผู้ทำรายการ'],
                            history.slice(0, 50).map(h => `<tr><td>${h[0]}</td><td>${h[1]}</td><td>${esc(h[2])}</td><td>${baht(h[3])}</td><td>${esc(h[4])}</td><td>${esc(h[5])}</td></tr>`).join('')));
            }
        };

        // ========== ตารางการชำระเงิน (กรองได้) ==========
        function rowsHtml() {
            const q = ($('#fq')?.value || '').trim().toLowerCase(), s = $('#fs')?.value || '';
            return payments.map((p, i) => ({ p, i }))
                .filter(({ p }) => (!q || p.orderId.toLowerCase().includes(q)) && (!s || p.status === s))
                .map(({ p, i }) => `<tr>
   <td><b>${p.orderId}</b><br><small class="muted">${p.date}</small></td>
   <td>${baht(p.amt)}</td>
   <td>${p.slipUrl ? `<a href="${esc(p.slipUrl)}" target="_blank" rel="noopener" style="color:var(--text)">${esc(p.slip)}</a>` : esc(p.slip || '-')}</td>
   <td>${payPill(p.status)}</td>
   <td class="muted">${esc(p.note || '-')}${p.status === 'refund' ? ` (คืน ${baht(p.refundAmt)})` : ''}</td>
   <td>${p.status === 'wait'
                        ? `<div class="acts"><button class="btn sm" onclick="approve(${i})">ยืนยัน</button><button class="btn line sm" onclick="startReject(${i})">ไม่ผ่าน</button></div>`
                        : p.status === 'ok'
                            ? `<button class="btn line sm" onclick="startRefund(${i})">คืนเงิน</button>`
                            : '<span class="muted">ดำเนินการแล้ว</span>'}</td></tr>`).join('');
        }
        function renderRows() {
            $('#prow').innerHTML = rowsHtml() || '<tr><td class="empty" colspan="6">ไม่พบรายการ</td></tr>';
        }

        // ========== ฟอร์มไม่ผ่าน / คืนเงิน ==========
        function rejectForm() {
            const p = payments[rejectIdx];
            return card('ไม่ผ่านการตรวจสอบ ' + p.orderId, '', `
  <label for="rj">เหตุผล (ลูกค้าจะเห็นข้อความนี้)</label>
  <input id="rj" placeholder="เช่น ยอดโอนไม่ตรง / สลิปไม่ชัดเจน"><br><br>
  <button class="btn" onclick="reject()">ยืนยันไม่ผ่าน</button> <button class="btn line" onclick="cancelForm()">ยกเลิก</button>`, 1);
        }
        function refundForm() {
            const p = payments[refundIdx];
            return card('คืนเงินให้ลูกค้า ' + p.orderId, 'ยอดที่ชำระ ' + baht(p.amt), `
  <div class="form">
   <div><label for="ra">จำนวนเงินที่คืน (฿)</label><input id="ra" type="number" min="1" max="${p.amt}" value="${p.amt}"></div>
   <div><label for="rr">เหตุผล</label><input id="rr" placeholder="เช่น สินค้าหมด / ลูกค้ายกเลิก"></div>
  </div><br>
  <button class="btn" onclick="refund()">ยืนยันคืนเงิน</button> <button class="btn line" onclick="cancelForm()">ยกเลิก</button>`, 1);
        }
        function cancelForm() { rejectIdx = null; refundIdx = null; go('finance') }

        // ========== ฟังก์ชันจัดการการเงิน (จุดที่ต้องเชื่อม API ภายหลัง) ==========
        function approve(i) {
            if (!guard('finance')) return;
            const p = payments[i]; p.status = 'ok'; p.note = '';
            addHistory(p.orderId, 'อนุมัติยอด', p.amt);
            // TODO: แจ้งระบบคำสั่งซื้อว่าชำระแล้ว เพื่อให้ฝ่ายจัดส่งเห็นงาน
            go('finance'); toast('อนุมัติยอดแล้ว');
        }
        function startReject(i) { if (!guard('finance')) return; rejectIdx = i; refundIdx = null; go('finance') }
        function reject() {
            if (!guard('finance')) return;
            const why = $('#rj').value.trim();
            if (!why) { toast('กรอกเหตุผลก่อน'); return }
            const p = payments[rejectIdx]; p.status = 'bad'; p.note = why;
            addHistory(p.orderId, 'ไม่ผ่าน', p.amt, why);
            rejectIdx = null; go('finance'); toast('บันทึกแล้ว');
        }
        function startRefund(i) { if (!guard('finance')) return; refundIdx = i; rejectIdx = null; go('finance') }
        function refund() {
            if (!guard('finance')) return;
            const p = payments[refundIdx], amt = +$('#ra').value, why = $('#rr').value.trim();
            if (!amt || amt <= 0 || amt > p.amt) { toast('จำนวนเงินคืนต้องไม่เกินยอดที่ชำระ'); return }
            if (!why) { toast('กรอกเหตุผลก่อน'); return }
            p.status = 'refund'; p.refundAmt = amt; p.note = why;
            addHistory(p.orderId, 'คืนเงิน', amt, why);
            refundIdx = null; go('finance'); toast('บันทึกการคืนเงินแล้ว');
        }

        // ========== เริ่มทำงาน ==========
        $('#tn').textContent = me.name; $('#te').textContent = me.email;
        go('overview');
    </script>
</body>

</html>
