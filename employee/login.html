<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOMPB เข้าสู่ระบบพนักงาน</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <main class="box">
      <h1 class="logo">HOMPB</h1>
      <p class="sub">ระบบหลังบ้าน · สำหรับพนักงาน</p>

      <form id="f">
        <label for="email">อีเมล</label>
        <input id="email" type="email" autocomplete="username" required />

        <label for="pw">รหัสผ่าน</label>
        <div class="pw">
          <input
            id="pw"
            type="password"
            autocomplete="current-password"
            required
          />
          <button
            id="eye"
            class="eye"
            type="button"
            aria-label="แสดงรหัสผ่าน"
            aria-pressed="false"
          >
            <!-- ตาเปิด: กดเพื่อแสดงรหัส -->
            <svg class="i-show" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <!-- ตาปิด (มีขีดทับ): กดเพื่อซ่อนรหัส -->
            <svg class="i-hide" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
              <path d="M3 3l18 18" />
            </svg>
          </button>
        </div>

        <p id="err" class="err" role="alert"></p>
        <button id="go" class="btn" type="submit">เข้าสู่ระบบ</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="login.js"></script>
  </body>
</html>
