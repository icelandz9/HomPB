<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOMPB ระบบหลังบ้าน (ฝ่ายจัดส่ง)</title>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #130f0e;
            --panel: #211a18;
            --side: #2b211e;
            --line: #3a2f2b;
            --acc: #a52c1c;
            --text: #f6efeb;
            --mute: #b9aaa3;
            --ok: #9fd8a8;
            --okbg: #1f3a2a;
            --warn: #f1cd6b;
            --warnbg: #3b2f14;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Anuphan', 'Noto Sans Thai', system-ui, sans-serif;
            font-size: 16px
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit
        }

        label {
            display: block;
            font-weight: 700;
            margin: 0 0 6px
        }

        input,
        select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px 14px
        }

        input:focus,
        select:focus,
        button:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        .btn {
            background: var(--acc);
            border: 0;
            border-radius: 999px;
            padding: 10px 22px;
            font-weight: 700;
            cursor: pointer
        }

        .btn.line {
            background: none;
            border: 1px solid var(--line)
        }

        .btn.sm {
            padding: 6px 14px
        }

        .logo {
            font-size: 34px;
            font-weight: 700;
            margin: 0
        }

        .sub {
            color: var(--mute);
            margin: 2px 0 0
        }

        /* โครงหน้า */
        #app {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh
        }

        aside {
            background: var(--side);
            padding: 28px 14px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh
        }

        aside .logo,
        aside .sub {
            padding: 0 10px
        }

        aside .sub {
            margin-bottom: 34px
        }

        nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        nav button,
        .out {
            background: none;
            border: 0;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            cursor: pointer;
            color: var(--text);
            display: flex;
            gap: 12px;
            align-items: center
        }

        nav button:hover,
        .out:hover {
            background: #3a2d29
        }

        nav button.on {
            background: var(--acc)
        }

        main {
            min-width: 0
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            background: #1c1513;
            border-bottom: 1px solid var(--line)
        }

        .top small {
            color: var(--mute);
            display: block
        }

        .pg {
            padding: 34px 30px 60px
        }

        h1 {
            font-size: 40px;
            margin: 0
        }

        .who {
            color: var(--mute);
            font-size: 19px;
            margin: 6px 0 26px
        }

        /* การ์ด / ตาราง */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 26px;
            margin-bottom: 26px;
            overflow: hidden
        }

        .ch {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px 28px;
            border-bottom: 1px solid var(--line)
        }

        .ch h2 {
            margin: 0;
            font-size: 22px
        }

        .ch span {
            color: var(--mute)
        }

        .cb {
            padding: 22px 28px
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 860px
        }

        th {
            text-align: left;
            color: var(--mute);
            padding: 14px 16px;
            background: #1c1513;
            white-space: nowrap
        }

        td {
            padding: 12px 16px;
            border-top: 1px solid var(--line);
            vertical-align: middle
        }

        td.empty {
            text-align: center;
            color: var(--mute);
            padding: 36px
        }

        td input,
        td select {
            padding: 8px 12px;
            border-radius: 12px
        }

        .pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px
        }

        .pill.o {
            background: var(--okbg);
            color: var(--ok)
        }

        .pill.w {
            background: var(--warnbg);
            color: var(--warn)
        }

        .pill.r {
            background: #3d1914;
            color: #ff9d8f
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 26px
        }

        .kpi {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px
        }

        .kpi p {
            margin: 0;
            color: var(--mute)
        }

        .kpi b {
            display: block;
            font-size: 44px;
            margin-top: 10px
        }

        .filters {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            padding: 18px 28px;
            border-bottom: 1px solid var(--line)
        }

        .filters>div {
            flex: 1;
            min-width: 200px
        }

        .acts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .muted {
            color: var(--mute)
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--acc);
            padding: 12px 20px;
            border-radius: 14px
        }

        @media(max-width:860px) {
            #app {
                grid-template-columns: 1fr
            }

            aside {
                position: static;
                height: auto;
                padding: 16px
            }

            nav {
                flex-direction: row;
                overflow-x: auto
            }

            nav button {
                white-space: nowrap
            }

            h1 {
                font-size: 30px
            }

            .pg,
            .top {
                padding-left: 16px;
                padding-right: 16px
            }
        }
    </style>
</head>

<body>

    <!-- ========== โครงหน้า: Sidebar + เนื้อหา ========== -->
    <div id="app">
        <aside>
            <h1 class="logo">HOMPB</h1>
            <p class="sub">ระบบหลังบ้าน</p>
            <nav id="nav"></nav>
            <button class="out" onclick="logout()">⎋ ออกจากระบบ</button>
        </aside>
        <main>
            <div class="top">
                <div><b id="tn"></b><small id="te"></small></div>
                <button class="btn line" onclick="toast('ใส่ลิงก์หน้าร้านภายหลัง')">ดูหน้าร้าน</button>
            </div>
            <div class="pg" id="pg"></div>
        </main>
    </div>

    <script>
        // ========== ผู้ใช้ปัจจุบัน (เชื่อมกับ Login ภายหลัง) ==========
        const me = { name: 'ฝ่ายจัดส่ง', email: 'ship@hompb.com', role: 'ฝ่ายจัดส่ง' };

        // ========== สิทธิ์ของฝ่ายจัดส่ง: M = จัดการ, V = ดูอย่างเดียว ==========
        const ACL = { overview: 'V', orders: 'V', shipping: 'M' };
        const PAGES = [['overview', 'ภาพรวม', '▦'], ['orders', 'คำสั่งซื้อ', '☰'], ['shipping', 'จัดส่ง & ที่อยู่ลูกค้า', '⛟']];
        const STATUSES = ['รอจัดส่ง', 'กำลังจัดส่ง', 'จัดส่งสำเร็จ'];
        const CARRIERS = ['ไปรษณีย์ไทย', 'Flash Express', 'J&T Express', 'Kerry Express', 'อื่น ๆ'];

        // ========== ข้อมูล (ว่างไว้ก่อน ค่อยเชื่อม API/ฐานข้อมูลภายหลัง) ==========
        // shipments: เฉพาะคำสั่งซื้อที่ชำระเงินแล้ว
        // {orderId,name,phone,addr,items,date,status,carrier,track}
        let shipments = [];
        // orders: {id,name,phone,items,addr,status,date}  (ไม่มียอดเงิน)
        let orders = [];
        // history: [เวลา, คำสั่งซื้อ, สถานะใหม่, ขนส่ง, เลขพัสดุ, ผู้ทำ]
        let history = [];

        // ========== ฟังก์ชันช่วย ==========
        const $ = s => document.querySelector(s);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const canM = p => ACL[p] === 'M';
        function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2200) }
        function logout() { toast('เชื่อมปุ่มออกจากระบบกับหน้า Login ภายหลัง') }
        function guard(p) { if (!canM(p)) { toast('คุณไม่มีสิทธิ์ดำเนินการนี้'); return false } return true }
        function card(title, note, body, pad) { return `<div class="card"><div class="ch"><h2>${title}</h2><span>${note || ''}</span></div>${pad ? `<div class="cb">${body}</div>` : body}</div>` }
        function table(heads, rowsHtml, id) { return `<div class="tw"><table><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr><tbody${id ? ` id="${id}"` : ''}>${rowsHtml || `<tr><td class="empty" colspan="${heads.length}">ยังไม่มีข้อมูล</td></tr>`}</tbody></table></div>` }
        function shipPill(s) { return s === 'จัดส่งสำเร็จ' ? `<span class="pill o">${s}</span>` : s === 'กำลังจัดส่ง' ? `<span class="pill w">${s}</span>` : `<span class="pill r">${s}</span>` }

        // ========== เปลี่ยนหน้า (เมนูแสดงตามสิทธิ์) ==========
        function go(p) {
            if (!ACL[p]) p = 'overview';
            $('#nav').innerHTML = PAGES.filter(x => ACL[x[0]]).map(x => `<button class="${x[0] === p ? 'on' : ''}" onclick="go('${x[0]}')"><span aria-hidden="true">${x[2]}</span>${x[1]}</button>`).join('');
            const t = PAGES.find(x => x[0] === p)[1];
            $('#pg').innerHTML = `<h1>${t}</h1><p class="who">${me.role} · สิทธิ์: ${canM(p) ? 'จัดการ' : 'ดูอย่างเดียว'}</p>` + VIEWS[p]();
            window.scrollTo(0, 0);
        }

        // ========== เนื้อหาแต่ละหน้า ==========
        const VIEWS = {

            // ---- ภาพรวม (ดูอย่างเดียว) ----
            overview() {
                const k = (l, v) => `<div class="kpi"><p>${l}</p><b>${v}</b></div>`;
                const n = s => shipments.filter(x => x.status === s).length;
                return `<div class="kpis">
  ${k('งานจัดส่งทั้งหมด', shipments.length)}
  ${k('รอจัดส่ง', n('รอจัดส่ง'))}
  ${k('กำลังจัดส่ง', n('กำลังจัดส่ง'))}
  ${k('จัดส่งสำเร็จ', n('จัดส่งสำเร็จ'))}
 </div>`;
            },

            // ---- คำสั่งซื้อ (ดูอย่างเดียว เห็นที่อยู่ ไม่เห็นยอดเงิน) ----
            orders() {
                const rows = orders.map(o => `<tr><td><b>${o.id}</b></td><td>${esc(o.name)}</td><td>${esc(o.phone)}</td><td>${esc(o.items)}</td><td>${esc(o.addr)}</td><td>${esc(o.status)}</td><td>${o.date}</td></tr>`).join('');
                return card('คำสั่งซื้อ', 'ดูอย่างเดียว · ยอดเงินเห็นได้เฉพาะ Admin และฝ่ายบัญชี',
                    table(['คำสั่งซื้อ', 'ผู้รับ', 'เบอร์โทร', 'สินค้า', 'ที่อยู่', 'สถานะ', 'วันที่'], rows));
            },

            // ---- จัดส่ง & ที่อยู่ลูกค้า (จัดการได้) ----
            shipping() {
                return card('งานจัดส่ง', 'แสดงเฉพาะคำสั่งซื้อที่ชำระเงินแล้ว · อัปเดตแล้วลูกค้าเห็นทันที',
                    `<div class="filters">
     <div><label for="fq">ค้นหา</label><input id="fq" placeholder="เลขคำสั่งซื้อ / ชื่อ / เบอร์" oninput="renderRows()"></div>
     <div><label for="fs">สถานะ</label><select id="fs" onchange="renderRows()"><option value="">ทั้งหมด</option>${STATUSES.map(s => `<option>${s}</option>`).join('')}</select></div>
    </div>`
                    + table(['คำสั่งซื้อ', 'ผู้รับ & ที่อยู่', 'สถานะการจัดส่ง', 'ขนส่ง', 'เลขพัสดุ', ''], rowsHtml(), 'prow'))
                    + card('ประวัติการอัปเดตจัดส่ง', 'บันทึกทุกครั้งที่เปลี่ยนสถานะหรือเลขพัสดุ',
                        table(['เวลา', 'คำสั่งซื้อ', 'สถานะ', 'ขนส่ง', 'เลขพัสดุ', 'ผู้ทำรายการ'],
                            history.slice(0, 50).map(h => `<tr><td>${h[0]}</td><td>${h[1]}</td><td>${esc(h[2])}</td><td>${esc(h[3] || '-')}</td><td>${esc(h[4] || '-')}</td><td>${esc(h[5])}</td></tr>`).join('')));
            }
        };

        // ========== ตารางงานจัดส่ง (กรองได้) ==========
        function rowsHtml() {
            const q = ($('#fq')?.value || '').trim().toLowerCase(), s = $('#fs')?.value || '';
            return shipments.map((x, i) => ({ x, i }))
                .filter(({ x }) => (!q || x.orderId.toLowerCase().includes(q) || x.name.toLowerCase().includes(q) || x.phone.includes(q)) && (!s || x.status === s))
                .map(({ x, i }) => `<tr>
   <td><b>${x.orderId}</b><br><small class="muted">${x.date}</small></td>
   <td>${esc(x.name)} · ${esc(x.phone)}<br><small class="muted">${esc(x.addr)}</small><br><small class="muted">${esc(x.items)}</small></td>
   <td><select id="ss${i}" aria-label="สถานะการจัดส่ง">${STATUSES.map(s => `<option${s === x.status ? ' selected' : ''}>${s}</option>`).join('')}</select><br><span style="display:inline-block;margin-top:6px">${shipPill(x.status)}</span></td>
   <td><select id="cr${i}" aria-label="ขนส่ง"><option value="">เลือกขนส่ง</option>${CARRIERS.map(c => `<option${c === x.carrier ? ' selected' : ''}>${c}</option>`).join('')}</select></td>
   <td><input id="tk${i}" value="${esc(x.track || '')}" placeholder="เลขพัสดุ" aria-label="เลขพัสดุ"></td>
   <td><div class="acts"><button class="btn sm" onclick="saveS(${i})">บันทึก</button><button class="btn line sm" onclick="copyAddr(${i})">คัดลอกที่อยู่</button></div></td></tr>`).join('');
        }
        function renderRows() {
            $('#prow').innerHTML = rowsHtml() || '<tr><td class="empty" colspan="6">ไม่พบรายการ</td></tr>';
        }

        // ========== ฟังก์ชันจัดการจัดส่ง (จุดที่ต้องเชื่อม API ภายหลัง) ==========
        function saveS(i) {
            if (!guard('shipping')) return;
            const x = shipments[i], st = $('#ss' + i).value, cr = $('#cr' + i).value, tk = $('#tk' + i).value.trim();
            // เริ่มส่งแล้วต้องมีขนส่งและเลขพัสดุ
            if (st !== 'รอจัดส่ง' && (!cr || !tk)) { toast('เลือกขนส่งและใส่เลขพัสดุก่อนเปลี่ยนสถานะ'); return }
            x.status = st; x.carrier = cr; x.track = tk;
            history.unshift([new Date().toLocaleString('th-TH'), x.orderId, st, cr, tk, me.email]);
            // TODO: ส่งสถานะ/เลขพัสดุไปให้ฝั่งลูกค้าเห็น
            go('shipping'); toast('บันทึกแล้ว');
        }
        function copyAddr(i) {
            const x = shipments[i], t = `${x.name} ${x.phone}\n${x.addr}`;
            (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('คัดลอกที่อยู่แล้ว')).catch(() => toast('คัดลอกไม่ได้ ลองเลือกข้อความเอง'));
        }

        // ========== เริ่มทำงาน ==========
        $('#tn').textContent = me.name; $('#te').textContent = me.email;
        go('overview');
    </script>
</body>

</html>
