<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOMPB ระบบหลังบ้าน (ฝ่ายบริการลูกค้า-ฝ่ายขาย)</title>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #130f0e;
            --panel: #211a18;
            --side: #2b211e;
            --line: #3a2f2b;
            --acc: #a52c1c;
            --text: #f6efeb;
            --mute: #b9aaa3;
            --ok: #9fd8a8;
            --okbg: #1f3a2a;
            --warn: #f1cd6b;
            --warnbg: #3b2f14;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Anuphan', 'Noto Sans Thai', system-ui, sans-serif;
            font-size: 16px
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        label {
            display: block;
            font-weight: 700;
            margin: 0 0 6px
        }

        input,
        select,
        textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px 14px
        }

        textarea {
            resize: vertical;
            min-height: 48px
        }

        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        .btn {
            background: var(--acc);
            border: 0;
            border-radius: 999px;
            padding: 10px 22px;
            font-weight: 700;
            cursor: pointer
        }

        .btn.line {
            background: none;
            border: 1px solid var(--line)
        }

        .btn.sm {
            padding: 6px 14px
        }

        .logo {
            font-size: 34px;
            font-weight: 700;
            margin: 0
        }

        .sub {
            color: var(--mute);
            margin: 2px 0 0
        }

        /* โครงหน้า */
        #app {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh
        }

        aside {
            background: var(--side);
            padding: 28px 14px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh
        }

        aside .logo,
        aside .sub {
            padding: 0 10px
        }

        aside .sub {
            margin-bottom: 34px
        }

        nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        nav button,
        .out {
            background: none;
            border: 0;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            cursor: pointer;
            color: var(--text);
            display: flex;
            gap: 12px;
            align-items: center
        }

        nav button:hover,
        .out:hover {
            background: #3a2d29
        }

        nav button.on {
            background: var(--acc)
        }

        main {
            min-width: 0
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            background: #1c1513;
            border-bottom: 1px solid var(--line)
        }

        .top small {
            color: var(--mute);
            display: block
        }

        .pg {
            padding: 34px 30px 60px
        }

        h1 {
            font-size: 40px;
            margin: 0
        }

        .who {
            color: var(--mute);
            font-size: 19px;
            margin: 6px 0 26px
        }

        /* การ์ด / ตาราง */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 26px;
            margin-bottom: 26px;
            overflow: hidden
        }

        .ch {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px 28px;
            border-bottom: 1px solid var(--line)
        }

        .ch h2 {
            margin: 0;
            font-size: 22px
        }

        .ch span {
            color: var(--mute)
        }

        .cb {
            padding: 22px 28px
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px
        }

        th {
            text-align: left;
            color: var(--mute);
            padding: 14px 16px;
            background: #1c1513;
            white-space: nowrap
        }

        td {
            padding: 12px 16px;
            border-top: 1px solid var(--line);
            vertical-align: middle
        }

        td.empty {
            text-align: center;
            color: var(--mute);
            padding: 36px
        }

        .pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px
        }

        .pill.o {
            background: var(--okbg);
            color: var(--ok)
        }

        .pill.w {
            background: var(--warnbg);
            color: var(--warn)
        }

        .pill.r {
            background: #3d1914;
            color: #ff9d8f
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 26px
        }

        .kpi {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px
        }

        .kpi p {
            margin: 0;
            color: var(--mute)
        }

        .kpi b {
            display: block;
            font-size: 44px;
            margin-top: 10px
        }

        .filters {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            padding: 18px 28px;
            border-bottom: 1px solid var(--line)
        }

        .filters>div {
            flex: 1;
            min-width: 200px
        }

        .muted {
            color: var(--mute)
        }

        .note {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px 22px;
            margin-bottom: 22px
        }

        /* แชท */
        .chat {
            display: grid;
            grid-template-columns: minmax(240px, 1fr) 2fr;
            gap: 20px
        }

        .clist {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .cl {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 16px;
            cursor: pointer;
            text-align: left;
            width: 100%
        }

        .cl.on {
            border-color: var(--acc)
        }

        .cl .row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center
        }

        .cl small {
            color: var(--mute);
            display: block;
            margin-top: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .cw {
            border: 1px solid var(--line);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 480px;
            background: var(--panel)
        }

        .cw header {
            background: var(--acc);
            padding: 16px 22px;
            font-weight: 700
        }

        .cw header small {
            display: block;
            font-weight: 400;
            opacity: .9
        }

        .msgs {
            flex: 1;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            max-height: 420px
        }

        .msgs small {
            color: var(--mute);
            margin-top: 6px
        }

        .bub {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 80%;
            white-space: pre-wrap
        }

        .bub.me {
            background: #3a1d18;
            border-color: var(--acc);
            align-self: flex-end
        }

        .msgs small.r {
            align-self: flex-end
        }

        .quick {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px 14px 0;
            border-top: 1px solid var(--line)
        }

        .cin {
            display: flex;
            gap: 10px;
            padding: 14px;
            align-items: flex-end
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--acc);
            padding: 12px 20px;
            border-radius: 14px
        }

        @media(max-width:860px) {
            #app {
                grid-template-columns: 1fr
            }

            aside {
                position: static;
                height: auto;
                padding: 16px
            }

            nav {
                flex-direction: row;
                overflow-x: auto
            }

            nav button {
                white-space: nowrap
            }

            h1 {
                font-size: 30px
            }

            .pg,
            .top {
                padding-left: 16px;
                padding-right: 16px
            }

            .chat {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>

    <!-- ========== โครงหน้า: Sidebar + เนื้อหา ========== -->
    <div id="app">
        <aside>
            <h1 class="logo">HOMPB</h1>
            <p class="sub">ระบบหลังบ้าน</p>
            <nav id="nav"></nav>
            <button class="out" onclick="logout()">⎋ ออกจากระบบ</button>
        </aside>
        <main>
            <div class="top">
                <div><b id="tn"></b><small id="te"></small></div>
                <button class="btn line" onclick="toast('ใส่ลิงก์หน้าร้านภายหลัง')">ดูหน้าร้าน</button>
            </div>
            <div class="pg" id="pg"></div>
        </main>
    </div>

    <script>
        // ========== ผู้ใช้ปัจจุบัน (เชื่อมกับ Login ภายหลัง) ==========
        const me = { name: 'ฝ่ายบริการลูกค้า-ฝ่ายขาย', email: 'cs@hompb.com', role: 'ฝ่ายบริการลูกค้า-ฝ่ายขาย' };
        const BRAND = 'ฝ่ายบริการลูกค้า HomPB'; // ชื่อที่ลูกค้าเห็น (ไม่แสดงชื่อพนักงาน)

        // ========== สิทธิ์ของฝ่ายนี้: M = จัดการ, V = ดูอย่างเดียว ==========
        const ACL = { overview: 'V', products: 'V', orders: 'V', chat: 'M' };
        const PAGES = [['overview', 'ภาพรวม', '▦'], ['products', 'สินค้า & สต๊อก', '◫'], ['orders', 'คำสั่งซื้อ', '☰'], ['chat', 'แชทลูกค้า', '✉']];
        const ZONES = ['ห้องนอน', 'ห้องน้ำ', 'ห้องนั่งเล่น', 'ห้องครัว', 'เครื่องใช้ไฟฟ้า'];
        const LOW = 10;
        // ข้อความสำเร็จรูป (แก้ได้ตามต้องการ)
        const QUICK = ['สวัสดีค่ะ ยินดีให้บริการค่ะ', 'รบกวนขอเลขคำสั่งซื้อด้วยนะคะ', 'ขอบคุณที่ติดต่อมานะคะ มีอะไรให้ช่วยเพิ่มเติมไหมคะ'];

        // ========== ข้อมูล (ว่างไว้ก่อน ค่อยเชื่อม API/ฐานข้อมูลภายหลัง) ==========
        let products = [];  // {id,name,zone,price,qty,desc}  (อ่านอย่างเดียว)
        let orders = [];    // {id,cust,items,status,date}    (ไม่มีที่อยู่/ยอดเงิน)
        // chats: [{id,customer,open:true|false, msgs:[{from:'cus'|'bot'|'staff',text,time}]}]
        let chats = [];
        let active = null;  // ลำดับแชทที่เปิดอยู่
        let draft = '';     // ร่างข้อความ (เช่น จากปุ่มแนะนำสินค้า)

        // ========== ฟังก์ชันช่วย ==========
        const $ = s => document.querySelector(s);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const baht = n => '฿' + Number(n).toLocaleString('th-TH');
        const canM = p => ACL[p] === 'M';
        function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2200) }
        function logout() { toast('เชื่อมปุ่มออกจากระบบกับหน้า Login ภายหลัง') }
        function guard(p) { if (!canM(p)) { toast('คุณไม่มีสิทธิ์ดำเนินการนี้'); return false } return true }
        function card(title, note, body, pad) { return `<div class="card"><div class="ch"><h2>${title}</h2><span>${note || ''}</span></div>${pad ? `<div class="cb">${body}</div>` : body}</div>` }
        function table(heads, rowsHtml, id) { return `<div class="tw"><table><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr><tbody${id ? ` id="${id}"` : ''}>${rowsHtml || `<tr><td class="empty" colspan="${heads.length}">ยังไม่มีข้อมูล</td></tr>`}</tbody></table></div>` }
        function stockPill(q) { return q <= 0 ? '<span class="pill r">หมดสต๊อก</span>' : q <= LOW ? '<span class="pill w">เหลือน้อย</span>' : '<span class="pill o">มีสินค้า</span>' }

        // ========== เปลี่ยนหน้า (เมนูแสดงตามสิทธิ์) ==========
        function go(p) {
            if (!ACL[p]) p = 'overview';
            $('#nav').innerHTML = PAGES.filter(x => ACL[x[0]]).map(x => `<button class="${x[0] === p ? 'on' : ''}" onclick="go('${x[0]}')"><span aria-hidden="true">${x[2]}</span>${x[1]}</button>`).join('');
            const t = PAGES.find(x => x[0] === p)[1];
            $('#pg').innerHTML = `<h1>${t}</h1><p class="who">${me.role} · สิทธิ์: ${canM(p) ? 'จัดการ' : 'ดูอย่างเดียว'}</p>` + VIEWS[p]();
            const m = $('.msgs'); if (m) m.scrollTop = m.scrollHeight;
            window.scrollTo(0, 0);
        }

        // ========== เนื้อหาแต่ละหน้า ==========
        const VIEWS = {

            // ---- ภาพรวม (ดูอย่างเดียว) ----
            overview() {
                const k = (l, v) => `<div class="kpi"><p>${l}</p><b>${v}</b></div>`;
                return `<div class="kpis">
  ${k('แชทที่รอตอบ', chats.filter(c => c.open).length)}
  ${k('แชททั้งหมด', chats.length)}
  ${k('สินค้าที่มีขาย', products.filter(p => p.qty > 0).length)}
 </div>`;
            },

            // ---- สินค้า & สต๊อก (ดูอย่างเดียว ไว้แนะนำลูกค้า) ----
            products() {
                return card('สินค้า', 'ดูอย่างเดียว · กด "แนะนำในแชท" เพื่อส่งข้อมูลสินค้าไปเป็นร่างข้อความ',
                    `<div class="filters">
    <div><label for="fq">ค้นหาสินค้า</label><input id="fq" placeholder="ชื่อหรือรหัสสินค้า" oninput="renderRows()"></div>
    <div><label for="fz">โซน</label><select id="fz" onchange="renderRows()"><option value="">ทุกโซน</option>${ZONES.map(z => `<option>${z}</option>`).join('')}</select></div>
   </div>`
                    + table(['รหัส', 'ชื่อสินค้า', 'โซน', 'ราคา (฿)', 'สถานะ', 'รายละเอียด', ''], rowsHtml(), 'prow'));
            },

            // ---- คำสั่งซื้อ (ดูอย่างเดียว ไม่แสดงที่อยู่/ยอดเงิน) ----
            orders() {
                const rows = orders.map(o => `<tr><td><b>${o.id}</b></td><td>${esc(o.cust)}</td><td>${esc(o.items)}</td><td>${esc(o.status)}</td><td>${o.date}</td></tr>`).join('');
                return card('คำสั่งซื้อ', 'ดูอย่างเดียว · ที่อยู่เห็นได้เฉพาะฝ่ายจัดส่ง ยอดเงินเห็นได้เฉพาะฝ่ายบัญชี',
                    table(['คำสั่งซื้อ', 'ลูกค้า', 'สินค้า', 'สถานะ', 'วันที่'], rows));
            },

            // ---- แชทลูกค้า (จัดการได้) ----
            chat() {
                const intro = `<div class="note">ลูกค้าจะเห็นข้อความของคุณในชื่อ “${BRAND}” โดยไม่แสดงชื่อพนักงาน</div>`;
                const list = chats.length ? chats.map((c, i) => {
                    const last = c.msgs[c.msgs.length - 1];
                    return `<button class="cl${i === active ? ' on' : ''}" onclick="openChat(${i})">
     <div class="row"><b>${esc(c.customer)}</b>${c.open ? '<span class="pill w">รอตอบ</span>' : '<span class="pill o">ตอบแล้ว</span>'}</div>
     <small>${last ? esc(last.text) : ''}</small></button>`
                }).join('')
                    : '<div class="note muted">ยังไม่มีแชทจากลูกค้า</div>';
                return intro + `<div class="chat"><div class="clist">${list}</div>${chatWindow()}</div>`;
            }
        };

        // ========== หน้าต่างแชท ==========
        function chatWindow() {
            if (active === null || !chats[active]) return `<div class="cw"><div class="msgs"><p class="muted">เลือกแชทจากรายการด้านซ้าย</p></div></div>`;
            const c = chats[active];
            const msgs = c.msgs.map(m => {
                const who = m.from === 'cus' ? 'ลูกค้า' : m.from === 'bot' ? 'บอท HomPB' : BRAND;
                const mine = m.from === 'staff';
                return `<small class="${mine ? 'r' : ''}">${who}${m.time ? ' · ' + m.time : ''}</small><div class="bub${mine ? ' me' : ''}">${esc(m.text)}</div>`
            }).join('');
            return `<div class="cw">
  <header>${esc(c.customer)}<small>${c.open ? 'รอเจ้าหน้าที่ตอบ' : 'ตอบแล้ว'}</small></header>
  <div class="msgs">${msgs}</div>
  <div class="quick">${QUICK.map((q, i) => `<button class="btn line sm" onclick="useQuick(${i})">${esc(q.slice(0, 18))}…</button>`).join('')}</div>
  <div class="cin"><textarea id="cm" rows="2" placeholder="ตอบลูกค้า…" aria-label="ข้อความตอบลูกค้า" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">${esc(draft)}</textarea><button class="btn" onclick="send()">ส่ง</button></div>
 </div>`;
        }

        // ========== ตารางสินค้า (กรองได้) ==========
        function rowsHtml() {
            const q = ($('#fq')?.value || '').trim().toLowerCase(), z = $('#fz')?.value || '';
            return products.map((p, i) => ({ p, i }))
                .filter(({ p }) => (!q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)) && (!z || p.zone === z))
                .map(({ p, i }) => `<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${p.zone}</td><td>${baht(p.price)}</td><td>${stockPill(p.qty)}</td><td class="muted">${esc(p.desc || '-')}</td>
   <td><button class="btn sm" onclick="recommend(${i})">แนะนำในแชท</button></td></tr>`).join('');
        }
        function renderRows() {
            $('#prow').innerHTML = rowsHtml() || '<tr><td class="empty" colspan="7">ไม่พบสินค้า</td></tr>';
        }

        // ========== ฟังก์ชันแชท (จุดที่ต้องเชื่อม API ภายหลัง) ==========
        function openChat(i) { draft = ''; active = i; go('chat') }
        function useQuick(i) { $('#cm').value = QUICK[i]; $('#cm').focus() }
        function send() {
            if (!guard('chat')) return;
            const v = $('#cm').value.trim();
            if (!v) return;
            if (active === null || !chats[active]) { toast('เลือกแชทก่อน'); return }
            chats[active].msgs.push({ from: 'staff', text: v, time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) });
            chats[active].open = false;
            draft = '';
            // TODO: ส่งข้อความไปให้ฝั่งลูกค้า (ใช้ชื่อ BRAND ไม่ส่งชื่อพนักงาน)
            go('chat');
        }
        // ปุ่มแนะนำสินค้า: ใส่ข้อมูลสินค้าเป็นร่างข้อความในแชทที่เปิดอยู่
        function recommend(i) {
            if (active === null || !chats[active]) { toast('เลือกแชทลูกค้าก่อน แล้วค่อยกดแนะนำสินค้า'); go('chat'); return }
            const p = products[i];
            draft = `แนะนำ “${p.name}” ค่ะ ราคา ${baht(p.price)}${p.desc ? ' · ' + p.desc : ''}${p.qty <= 0 ? ' (ขณะนี้สินค้าหมดชั่วคราว)' : ''}`;
            go('chat'); toast('ใส่ข้อความแนะนำสินค้าให้แล้ว แก้ไขก่อนส่งได้');
        }

        // ========== เริ่มทำงาน ==========
        $('#tn').textContent = me.name; $('#te').textContent = me.email;
        go('overview');
    </script>
</body>
