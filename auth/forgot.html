<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลืมรหัสผ่าน | HomPB</title>
  <link rel="icon" href="../img/Logo/hompb-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="css/auth.css">
  <!-- เปลี่ยนภาษา ไทย / English: โหลดก่อน script อื่น -->
  <script src="../js/i18n.js"></script>
</head>

<body>
  <main class="auth">
    <section class="brand" aria-label="HomPB">
      <a href="../index.html" class="logo" aria-label="HomPB หน้าแรก"><img class="logo-ic" src="../img/Logo/hompb-icon.svg" alt="" width="36" height="36">HOMPB</a>
      <div>
        <h1>ลืมรหัสผ่าน?</h1>
        <p>ไม่เป็นไร ใส่อีเมลที่ใช้สมัคร แล้วเราจะส่งลิงก์ตั้งรหัสผ่านใหม่ให้</p>
      </div>
      <ul>
        <li>ลิงก์ใช้ได้ครั้งเดียว และหมดอายุใน 1 ชั่วโมง</li>
        <li>ถ้าไม่เห็นอีเมล ลองดูในโฟลเดอร์ Junk / Spam</li>
      </ul>
    </section>

    <section class="panel">
      <a href="login.html" class="back">← กลับไปหน้าเข้าสู่ระบบ</a>
      <h2>ลืมรหัสผ่าน</h2>
      <p class="subtitle">เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลนี้</p>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email">อีเมล</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>

        <p id="error" class="error-message" role="alert"></p>
        <p id="success" class="success-message" role="status"></p>
        <button type="submit" id="submitBtn" class="btn-submit">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
      </form>

      <p class="auth-footer">นึกออกแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="js/password-reset.js"></script>
</body>

</html>
