<!DOCTYPE html>
<html lang="en">

<head>
    <!-- contains information required by the browser that is not displayed on the screen -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Make the webpage responsive for mobile devices. -->
    <title>HomPB - Login</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-card">
        <!-- The login card box uses a CSS class to define its styling. -->
        <h2>Login to HomPB</h2>
        <p class="subtitle">Login for your funiture</p>

        <form id="loginForm" method="POST" action="#">
            <!-- Data entry form / POST = submit data discreetly / action = backend destination URL -->
            <div class="form-group">
                <!-- A group consisting of a label and an input for the username -->
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <!-- A group consisting of a label and an input for the password -->
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password"
                    autocomplete="current-password" required>
                <!--The password manager scans from this point to perform various tasks, such as auto-filling passwords or generating random passwords.-->
                <!-- type = password masks password as dots ,autocomplete = enables browser autofill for saved passwords , required = makes the field mandatory -->
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
</body>

</html>
