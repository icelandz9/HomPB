<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - HomPB</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-card">
        <h2>Sign up</h2>
        <p class="subtitle">Create a new user account for HomPB</p>

        <form id="registerForm" method="POST" action="#">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password"
                    minlength="6" required>
                <!--The password manager scans from this point to perform various tasks, such as auto-filling passwords or generating random passwords.-->
                <!-- minlength="6" requires at least 6 characters -->
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
                    autocomplete="new-password" required>
                <!-- separate field for re-entering the password to confirm it matches_
                     autocomplete=new-password groups it with the password field above-->
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

</body>

</html>
